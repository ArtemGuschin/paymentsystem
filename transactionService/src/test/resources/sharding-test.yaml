dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:65431/transaction_db_0
    username: postgres
    password: postgres

  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:65432/transaction_db_1
    username: postgres
    password: postgres

rules:

  - !SINGLE
    tables:
      - ds_0.wallet_types
      - ds_1.wallet_types

  - !SHARDING

    tables:

      wallets:
        actualDataNodes: ds_${0..1}.wallets
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

      transactions:
        actualDataNodes: ds_${0..1}.transactions
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

      payment_requests:
        actualDataNodes: ds_${0..1}.payment_requests
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

      top_up_requests:
        actualDataNodes: ds_${0..1}.top_up_requests
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

      withdrawal_requests:
        actualDataNodes: ds_${0..1}.withdrawal_requests
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

      transfer_requests:
        actualDataNodes: ds_${0..1}.transfer_requests
        databaseStrategy:
          standard:
            shardingColumn: user_uid
            shardingAlgorithmName: user-sharding
        tableStrategy:
          none: {}

    shardingAlgorithms:

      user-sharding:
        type: INLINE
        props:
          algorithm-expression: ds_${Math.abs(user_uid.hashCode()) % 2}

props:
  sql-show: true