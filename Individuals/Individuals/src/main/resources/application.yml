server:
  port: 9093

spring:
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9091/realms/individuals-realm}

  cloud:
    compatibility-verifier:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    root: INFO
    com.artem.transaction.client: INFO

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:9091}
  realm: individuals-realm
  client-id: individuals-api
  client-secret:  ${KEYCLOAK_CLIENT_SECRET:your-client-secret}
  admin-username: admin
  admin-password: admin

person:
  service:
    base-url: ${PERSON_SERVICE_URL:http://localhost:8091}

transaction:
  service:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8585/api/v1}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

auth-service:
  url: http://localhost:9090

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html