spring:
  application:
    name: webhook-collector-service

  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_collector_db
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 7878

webhook:
  security:
    token: ${WEBHOOK_SECURITY_TOKEN:fake-provider-secret}

transaction-service:
  url: ${TRANSACTION_SERVICE_URL:http://localhost:8585}