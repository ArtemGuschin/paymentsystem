version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: payment-postgres

    environment:
      POSTGRES_DB: fake_provider
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_provider"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: fake-payment-provider

    ports:
      - "8898:8888"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fake_provider
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy