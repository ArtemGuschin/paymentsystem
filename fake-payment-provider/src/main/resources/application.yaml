spring:
  application:
    name: fake-payment-provider

  datasource:
    url: jdbc:postgresql://localhost:5432/fake_provider
    username: postgres
    password: postgres
    hikari:
      initializationFailTimeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8888

fake-payment-provider:
  security:
    username: ${FAKE_PAYMENT_PROVIDER_USERNAME:payment-service}
    password: ${FAKE_PAYMENT_PROVIDER_PASSWORD:payment-service-secret}

webhook:
  collector-url: ${WEBHOOK_COLLECTOR_URL:http://localhost:7878/api/v1/webhooks/payment-provider}
  security:
    token: ${WEBHOOK_SECURITY_TOKEN:fake-provider-secret}

logging:
  level:
    org.springframework.security: TRACE