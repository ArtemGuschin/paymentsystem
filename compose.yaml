services:

  payment-db:
    image: postgres:15
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-db:
    image: postgres:15
    container_name: provider-db
    environment:
      POSTGRES_DB: fake_provider
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_provider"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-payment-provider:
    build:
      context: ./fake-payment-provider
    container_name: fake-payment-provider
    ports:
      - "8898:8888"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://provider-db:5432/fake_provider
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      provider-db:
        condition: service_healthy

  payment-service:
    build:
      context: ./paymentService
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      FAKE_PAYMENT_PROVIDER_URL: http://fake-payment-provider:8888
      FAKE_PAYMENT_PROVIDER_USERNAME: payment-service
      FAKE_PAYMENT_PROVIDER_PASSWORD: payment-service-secret
    depends_on:
      payment-db:
        condition: service_healthy
      fake-payment-provider:
        condition: service_started

  individuals-api:
    build:
      context: ./Individuals
      args:
        NEXUS_URL: http://host.docker.internal:8081/repository/maven-public/
    container_name: individuals-api
    ports:
      - "9090:9093"
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      payment-service:
        condition: service_started