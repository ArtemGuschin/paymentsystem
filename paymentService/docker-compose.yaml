services:
  payment-db:
    image: postgres:15
    container_name: payment-db

    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build: .
    container_name: payment-service

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      FAKE_PAYMENT_PROVIDER_URL: http://host.docker.internal:8898
      FAKE_PAYMENT_PROVIDER_USERNAME: payment-service
      FAKE_PAYMENT_PROVIDER_PASSWORD: payment-service-secret

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      payment-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      payment-service:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus