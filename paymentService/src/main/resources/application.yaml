spring:
  application:
    name: paymentService

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service
    username: postgres
    password: postgres
    hikari:
      initializationFailTimeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

payment-service:
  url: http://localhost:8083
  connect-timeout: 5s
  read-timeout: 30s

  security:
    username: admin
    password-hash: "$2a$10$NbZWJ28OPpT/tYAh6VuZn.20bKwf7AiXLgtCmSYMAVGyLGXFhYm/q"

fake-payment-provider:
  base-url: ${FAKE_PAYMENT_PROVIDER_URL:http://localhost:8888}
  username: ${FAKE_PAYMENT_PROVIDER_USERNAME:payment-service}
  password: ${FAKE_PAYMENT_PROVIDER_PASSWORD:payment-service-secret}

webhook:
  collector-url: ${WEBHOOK_COLLECTOR_URL:http://localhost:7878/api/v1/webhooks/payment-provider}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    root: INFO