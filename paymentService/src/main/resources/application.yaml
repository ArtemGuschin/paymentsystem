spring:
  application:
    name: paymentService

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service
    username: postgres
    password: postgres
    hikari:
      initializationFailTimeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

payment-service:
  url: http://localhost:8083
  connect-timeout: 5s
  read-timeout: 30s

fake-payment-provider:
  base-url: ${FAKE_PAYMENT_PROVIDER_URL:http://localhost:8888}
  username: ${FAKE_PAYMENT_PROVIDER_USERNAME:payment-service}
  password: ${FAKE_PAYMENT_PROVIDER_PASSWORD:payment-service-secret}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG